# Music cues used by [MUSIC <name>]. Each needs a free-library file at assets/music/<name>.mp3
# ($0 policy: music generation is off). The descriptions below are what to look for when picking a track.
# [MUSIC none] / [MUSIC stop] fades the bed out.
music:
  tense_build: >
    Instrumental, no vocals. Slow-building tension underscore, low strings ostinato,
    soft pulsing synth, sparse percussion, 80 bpm, cinematic, leaves room for narration.
  calm_reflective: >
    Instrumental, no vocals. Gentle reflective piano and warm pads, 70 bpm, understated.
  action_drive: >
    Instrumental, no vocals. Driving action underscore, taiko and staccato strings,
    120 bpm, energetic but mixed low enough to sit under a voice.
  playful_banter: >
    Instrumental, no vocals. Light, mischievous pizzicato strings and muted brass,
    bouncy 100 bpm, comedic but warm, sits low under dialogue.
  mystery_reveal: >
    Instrumental, no vocals. Shimmering ethereal pads and a slow celesta motif,
    sense of wonder and unease, 60 bpm, builds gently then holds.
